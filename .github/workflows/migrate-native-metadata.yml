name: Migrate issue metadata

on:
  push:
    paths:
      - .github/workflows/migrate-native-metadata.yml

permissions:
  contents: read
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: spotter-agent
      REPO: spotter
      API_VERSION: 2026-03-10
    steps:
      - name: Migrate open issues
        shell: bash
        run: |
          set -euo pipefail

          api() {
            gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: ${API_VERSION}" "$@"
          }

          priority_id=""
          effort_id=""
          area_id=""

          # First try the organization REST catalog. Repository-scoped Actions tokens
          # may not have organization Issue Fields:read even when they can set values.
          fields_json=""
          if fields_json=$(api "/orgs/${OWNER}/issue-fields" 2>/tmp/issue-fields.err); then
            priority_id=$(jq -r '.[] | select(.name == "Priority") | .id' <<<"${fields_json}" | head -n1)
            effort_id=$(jq -r '.[] | select(.name == "Effort") | .id' <<<"${fields_json}" | head -n1)
            area_id=$(jq -r '.[] | select(.name == "Area") | .id' <<<"${fields_json}" | head -n1)
          else
            echo "Organization field catalog unavailable to Actions token; trying repository-inherited fields via GraphQL."
          fi

          # Repository.issueFields exposes fields inherited from the organization and
          # can be readable with repository metadata access even when org field admin
          # endpoints are not. fullDatabaseId is the integer required by REST writes.
          if [[ -z "${priority_id}" || -z "${effort_id}" || -z "${area_id}" ]]; then
            graphql_fields=""
            if graphql_fields=$(gh api graphql \
              -f owner="${OWNER}" \
              -f repo="${REPO}" \
              -f query='query($owner:String!,$repo:String!){repository(owner:$owner,name:$repo){issueFields(first:50){nodes{__typename ... on IssueFieldSingleSelect{name fullDatabaseId}}}}}' \
              2>/tmp/graphql-fields.err); then
              priority_id=$(jq -r '.data.repository.issueFields.nodes[] | select(.name == "Priority") | .fullDatabaseId // empty' <<<"${graphql_fields}" | head -n1)
              effort_id=$(jq -r '.data.repository.issueFields.nodes[] | select(.name == "Effort") | .fullDatabaseId // empty' <<<"${graphql_fields}" | head -n1)
              area_id=$(jq -r '.data.repository.issueFields.nodes[] | select(.name == "Area") | .fullDatabaseId // empty' <<<"${graphql_fields}" | head -n1)
            else
              echo "::warning::Repository issueFields GraphQL lookup also failed."
              cat /tmp/graphql-fields.err || true
            fi
          fi

          if [[ -n "${priority_id}" && -n "${effort_id}" && -n "${area_id}" ]]; then
            echo "Resolved issue fields: Priority=${priority_id}, Effort=${effort_id}, Area=${area_id}"
          else
            echo "::warning::Could not resolve Priority, Effort, and Area field IDs; structured field values will be skipped."
            priority_id=""; effort_id=""; area_id=""
          fi

          update_issue() {
            local number="$1" type="$2" priority="$3" effort="$4" area="$5" milestone="$6"
            local patch
            if [[ "${milestone}" == "none" ]]; then
              patch=$(jq -n --arg type "${type}" '{type:$type,labels:[]}')
            else
              patch=$(jq -n --arg type "${type}" --argjson milestone "${milestone}" '{type:$type,milestone:$milestone,labels:[]}')
            fi
            api --method PATCH "/repos/${OWNER}/${REPO}/issues/${number}" --input - <<<"${patch}" >/dev/null

            if [[ -n "${priority_id}" && -n "${effort_id}" && -n "${area_id}" ]]; then
              jq -n \
                --argjson priority_id "${priority_id}" --arg priority "${priority}" \
                --argjson effort_id "${effort_id}" --arg effort "${effort}" \
                --argjson area_id "${area_id}" --arg area "${area}" \
                '{issue_field_values:[
                  {field_id:$priority_id,value:$priority},
                  {field_id:$effort_id,value:$effort},
                  {field_id:$area_id,value:$area}
                ]}' |
                api --method POST "/repos/${OWNER}/${REPO}/issues/${number}/issue-field-values" --input - >/dev/null
            fi
            echo "migrated #${number}: ${type} / ${priority} / ${effort} / ${area} / milestone=${milestone}"
          }

          # number type priority effort area milestone
          update_issue 21 Experiment   High   M  Evaluation   3
          update_issue 22 Feature      Medium L  Intervention 4
          update_issue 23 Experiment   Medium M  Evaluation   4
          update_issue 24 Experiment   Medium M  Detection    3
          update_issue 26 Feature      Low    XL Recovery     5
          update_issue 28 Feature      Medium L  Detection    3
          update_issue 30 Architecture Medium L  Recovery     5
          update_issue 31 Architecture High   L  Runtime      1
          update_issue 33 Feature      High   M  Evaluation   2
          update_issue 34 Experiment   Medium M  Evaluation   4
          update_issue 36 Experiment   Low    L  Evaluation   6
          update_issue 37 Experiment   High   M  Observation  2
          update_issue 38 Experiment   Medium M  Detection    3
          update_issue 42 Experiment   High   L  Evaluation   3
          update_issue 45 Feature      Medium M  Intervention 4
          update_issue 47 Task         Medium M  Operations   6
          update_issue 68 Task         Low    XS Community    none
          update_issue 69 Task         Low    S  Community    none
          update_issue 70 Task         Low    S  Community    none
          update_issue 78 Experiment   Urgent L  Runtime      1

          issue_id() {
            api "/repos/${OWNER}/${REPO}/issues/$1" --jq '.id'
          }

          add_blocked_by() {
            local issue="$1" blocker="$2"
            if api "/repos/${OWNER}/${REPO}/issues/${issue}/dependencies/blocked_by" --jq '.[].number' | grep -qx "${blocker}"; then
              echo "dependency already exists: #${issue} blocked by #${blocker}"
              return
            fi
            local blocker_id
            blocker_id=$(issue_id "${blocker}")
            api --method POST "/repos/${OWNER}/${REPO}/issues/${issue}/dependencies/blocked_by" -F issue_id="${blocker_id}" >/dev/null
            echo "dependency: #${issue} blocked by #${blocker}"
          }

          # Only encode relationships that genuinely prevent completion.
          add_blocked_by 31 78
          add_blocked_by 28 78
          add_blocked_by 28 31
          add_blocked_by 37 78
          add_blocked_by 22 78
          add_blocked_by 22 31
          add_blocked_by 22 28
          add_blocked_by 23 21
          add_blocked_by 23 42
          add_blocked_by 23 22
          add_blocked_by 24 28
          add_blocked_by 24 33
          add_blocked_by 34 21
          add_blocked_by 34 42
          add_blocked_by 26 22
          add_blocked_by 26 30
          add_blocked_by 26 34
          add_blocked_by 26 38
          add_blocked_by 36 33
          add_blocked_by 36 28
          add_blocked_by 36 22
          add_blocked_by 36 26

          # Labels are exceptional contributor-facing tags only.
          api --paginate "/repos/${OWNER}/${REPO}/labels?per_page=100" --jq '.[].name' | while IFS= read -r label; do
            case "${label}" in
              "good first issue"|"help wanted") continue ;;
            esac
            encoded=$(jq -rn --arg value "${label}" '$value|@uri')
            api --method DELETE "/repos/${OWNER}/${REPO}/labels/${encoded}" >/dev/null
            echo "deleted label: ${label}"
          done
