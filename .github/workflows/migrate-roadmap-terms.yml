name: Migrate roadmap terms

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-roadmap-terms.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace deprecated phase vocabulary and remove this migration
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "docs/architecture.md": {
                  "First architecture PoC | [15. P0 App Server lifecycle / attach PoC](#15-p0-app-server-lifecycle--attach-poc)": "Runtime architecture gate | [15. Runtime gate: App Server lifecycle / attach PoC](#15-runtime-gate-app-server-lifecycle--attach-poc)",
                  "That is why P0 comes before the daemon migration.": "That is why the Runtime App Server gate (#78) comes before the daemon migration.",
                  "# 15. P0 App Server lifecycle / attach PoC": "# 15. Runtime gate: App Server lifecycle / attach PoC",
              },
              "docs/lifecycle.md": {
                  "P0 must determine the canonical startup strategy before the service lifecycle is finalized.": "The Runtime App Server gate (#78) must determine the canonical startup strategy before the service lifecycle is finalized.",
                  "The exact changes depend on the P0-selected App Server strategy.": "The exact changes depend on the App Server strategy selected by the Runtime gate.",
                  "If P0 confirms that an external App Server must already exist": "If the Runtime gate confirms that an external App Server must already exist",
              },
              "docs/research.md": {
                  "| App Server observation/control | 🧪 | P0 architecture PoC required |": "| App Server observation/control | 🧪 | Runtime App Server PoC required (#78) |",
                  "That must be measured after P4.": "That must be measured after the Observe stage.",
                  "This is why P5 separates cheap signal generation from semantic verdicts.": "This is why the Detect stage separates cheap signal generation from semantic verdicts.",
                  "**Decision affected:** P5 signal policy.": "**Decision affected:** Detect-stage signal policy.",
              },
          }

          old_repo = "https://github.com/Bogyie/spotter/issues/66"
          new_repo = "https://github.com/spotter-agent/spotter/issues/66"

          for filename, mapping in replacements.items():
              path = Path(filename)
              text = path.read_text()
              text = text.replace(old_repo, new_repo)
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f"expected text not found in {filename}: {old}")
                  text = text.replace(old, new)
              text = "\n".join(line.rstrip() for line in text.splitlines()) + "\n"
              path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/migrate-roadmap-terms.yml
          git add docs/architecture.md docs/lifecycle.md docs/research.md
          git diff --cached --check
          git commit -m "docs: remove deprecated roadmap phase codes"
          git push
